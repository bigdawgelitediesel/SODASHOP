<!doctype html><html><head><link rel="stylesheet" href="base.css"><style>
body{background:var(--yellow)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--pad);color:var(--ink)}
.ring{position:relative;display:flex;align-items:center;justify-content:center;width:var(--rs);height:var(--rs);border-radius:50%;background:radial-gradient(circle,var(--red) 0 14%,#111 15% 100%);box-shadow:0 0 0 14px rgba(22,33,58,.08),0 0 0 28px rgba(22,33,58,.05)}
.ring:after{pointer-events:none;content:"";position:absolute;inset:20%;border-radius:50%;border:3px solid rgba(255,255,255,.12)}
.jk{position:relative;height:var(--jh);filter:drop-shadow(0 0 4px #fff) drop-shadow(10px 10px 0 rgba(22,33,58,.35))}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.4);justify-content:center}
.chip{background:#fff;border:5px solid var(--ink);border-radius:999px;padding:calc(var(--u)*1.1) calc(var(--u)*2.6);font-family:'Lilita One';font-size:calc(var(--u)*3.2)}
</style></head><body><div class="ad">
<div class="checker" style="position:absolute;top:0;left:0;right:0"></div>
<div class="checker" style="position:absolute;bottom:0;left:0;right:0"></div>
<div class="wrap">
  <div style="font-family:'Lilita One';font-size:calc(var(--u)*10);line-height:1;color:var(--red);text-shadow:6px 6px 0 var(--ink);margin-top:calc(var(--u)*2)">Jukey's on tour!</div>
  <div class="it" style="font-size:calc(var(--u)*3.7);white-space:nowrap;margin-top:calc(var(--u)*1.5)">New stops around Rapid City every week</div>
  <div class="ring" style="margin-top:var(--gap)"><img class="jk" src="jukey.png"></div>
  <div class="chips" style="margin-top:var(--gap)">
    <span class="chip">🥤 Dirty sodas</span><span class="chip">⚡ Energy drinks</span><span class="chip">🍪 Sweet treats</span>
  </div>
  <div style="font-size:calc(var(--u)*3.4);font-weight:800;margin-top:calc(var(--u)*3);line-height:1.3">Parks, schools, games &amp; festivals.<br>Check the tour dates and come say hi!</div>
  <div class="btn" style="background:var(--red);color:#fff;font-size:calc(var(--u)*4.4);padding:calc(var(--u)*2) calc(var(--u)*5);margin-top:calc(var(--u)*3.5)">See this week's tour →</div>
  <div style="flex:1;min-height:calc(var(--u)*2)"></div>
  <div class="sans" style="font-size:calc(var(--u)*3.2);margin-bottom:calc(var(--u)*1)">THE JUKEBOX SODA SHOP</div>
</div></div></body></html>
