<!doctype html><html><head><link rel="stylesheet" href="base.css"><style>
.bg{position:absolute;inset:0;background:url(trailer-day.png) center/cover;filter:saturate(1.1)}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(22,33,58,.97) 0%,rgba(22,33,58,.85) 45%,rgba(22,33,58,.35) 100%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:var(--pad)}
.kick{font-family:Pacifico,cursive}
.jukey{position:absolute;right:var(--jr);top:var(--jt);height:var(--jh);transform:rotate(6deg);filter:drop-shadow(0 0 3px #fff7e6) drop-shadow(6px 6px 0 rgba(0,0,0,.35))}
</style></head><body><div class="ad">
<div class="bg"></div><div class="shade"></div>
<img class="jukey" src="jukey.png">
<div class="wrap">
  <div class="sans" style="font-size:calc(var(--u)*3.4);color:var(--yellow)">NOW PLAYING IN RAPID CITY</div>
  <div style="margin-top:calc(var(--u)*1.5)">
    <div class="sans" style="font-size:calc(var(--u)*4.6)">THE</div>
    <div class="jukebox" style="font-size:calc(var(--u)*15)">JUKEBOX</div>
    <div class="sans" style="font-size:calc(var(--u)*6)">SODA SHOP</div>
  </div>
  <div class="it" style="font-size:calc(var(--u)*4.2);color:var(--yellow);margin-top:calc(var(--u)*2.5)">It's not just a soda. It's your soundtrack.</div>
  <div style="font-size:calc(var(--u)*3.6);font-weight:600;margin-top:calc(var(--u)*2.5);max-width:90%;line-height:1.35">Handcrafted dirty sodas, energy drinks &amp; treats, each named after a classic hit.</div>
  <div class="btn" style="font-size:calc(var(--u)*4.4);padding:calc(var(--u)*2) calc(var(--u)*5);margin-top:calc(var(--u)*4)">Find this week's stops →</div>
</div></div></body></html>
